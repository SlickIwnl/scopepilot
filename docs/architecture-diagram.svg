<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">ScopePilot architecture diagram</title>
  <desc id="desc">A consultant inquiry flows through a React browser, Fastify and Zod validation, a request-scoped Strands Agent, Amazon Bedrock Nova Lite, and a reviewable handoff. An offline fixture path and evaluation controls are shown below.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#fb923c"/>
    </marker>
    <marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#93c5fd"/>
    </marker>
    <style>
      .title { font: 700 44px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; letter-spacing: 1px; }
      .subtitle { font: 400 22px 'Segoe UI', Arial, sans-serif; fill: #bfdbfe; }
      .eyebrow { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #fdba74; letter-spacing: 2px; }
      .card-title { font: 700 23px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .card-title-light { font: 700 23px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .card-body { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .card-body-light { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #dbeafe; }
      .small { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .small-light { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #bfdbfe; }
      .label { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; letter-spacing: 1.5px; }
      .output-title { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .output-body { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .footer { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #93c5fd; }
    </style>
  </defs>

  <rect width="1800" height="1100" fill="url(#bg)"/>
  <circle cx="1660" cy="70" r="210" fill="#1d4ed8" opacity="0.13"/>
  <circle cx="90" cy="1030" r="220" fill="#f97316" opacity="0.08"/>

  <text x="70" y="72" class="eyebrow">SCOPEPILOT / PROFESSIONAL AGENTS TRACK</text>
  <text x="70" y="126" class="title">One client inquiry. One governed handoff.</text>
  <text x="70" y="164" class="subtitle">A request-scoped Strands Agent turns ambiguous intake into a reviewable brief, proposal, and next move.</text>

  <rect x="1480" y="72" width="250" height="46" rx="23" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1"/>
  <text x="1605" y="101" text-anchor="middle" class="label" fill="#bfdbfe">AMAZON BEDROCK + STRANDS</text>

  <!-- Runtime path -->
  <text x="70" y="214" class="label">RUNTIME PATH</text>

  <g filter="url(#shadow)">
    <rect x="70" y="236" width="340" height="270" rx="18" fill="#f8fafc"/>
    <rect x="70" y="236" width="340" height="9" rx="4" fill="#fb923c"/>
    <text x="98" y="282" class="eyebrow">01 / INPUT</text>
    <text x="98" y="320" class="card-title">React browser</text>
    <text x="98" y="354" class="card-body">Consultant cockpit</text>
    <text x="98" y="394" class="small">- Synthetic client inquiry</text>
    <text x="98" y="423" class="small">- Consultant profile selection</text>
    <text x="98" y="452" class="small">- Challenge and desired outcome</text>
    <text x="98" y="481" class="small">- Human submits for review</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="480" y="236" width="370" height="270" rx="18" fill="#f8fafc"/>
    <rect x="480" y="236" width="370" height="9" rx="4" fill="#60a5fa"/>
    <text x="508" y="282" class="eyebrow" fill="#2563eb">02 / BOUNDARY</text>
    <text x="508" y="320" class="card-title">Fastify API + Zod</text>
    <text x="508" y="354" class="card-body">Dependency-injected workflow</text>
    <text x="508" y="394" class="small">1. Validate InquirySchema</text>
    <text x="508" y="423" class="small">2. Select supplied consultant facts</text>
    <text x="508" y="452" class="small">3. Create request-scoped agent</text>
    <text x="508" y="481" class="small">4. Return a validated envelope</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="920" y="236" width="430" height="270" rx="18" fill="url(#agent)"/>
    <text x="950" y="282" class="eyebrow" fill="#431407">03 / REASON</text>
    <text x="950" y="320" class="card-title-light">Strands Agent</text>
    <text x="950" y="354" class="card-body-light">One agent per request</text>
    <text x="950" y="394" class="small-light">- Supplied facts only</text>
    <text x="950" y="423" class="small-light">- Model reasoning + structured output</text>
    <text x="950" y="452" class="small-light">- WorkflowDraftSchema validation</text>
    <text x="950" y="481" class="small-light">- BeforeModelCall invocation guard</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1420" y="236" width="310" height="270" rx="18" fill="#f8fafc"/>
    <rect x="1420" y="236" width="310" height="9" rx="4" fill="#38bdf8"/>
    <text x="1448" y="282" class="eyebrow" fill="#0369a1">04 / MODEL</text>
    <text x="1448" y="320" class="card-title">Amazon Bedrock</text>
    <text x="1448" y="354" class="card-body">Amazon Nova Lite</text>
    <text x="1448" y="394" class="small">- AWS credential provider chain</text>
    <text x="1448" y="423" class="small">- One permitted invocation</text>
    <text x="1448" y="452" class="small">- Transport retries disabled</text>
    <text x="1448" y="481" class="small">- No external action tools</text>
  </g>

  <path d="M410 371 H468" stroke="#fb923c" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M850 371 H908" stroke="#fb923c" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1350 371 H1408" stroke="#fb923c" stroke-width="4" fill="none" marker-start="url(#arrow-muted)" marker-end="url(#arrow)"/>
  <rect x="416" y="326" width="58" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="852" y="326" width="66" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="1335" y="326" width="80" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="445" y="348" text-anchor="middle" class="label">HTTP</text>
  <text x="885" y="348" text-anchor="middle" class="label">INQUIRY</text>
  <text x="1375" y="348" text-anchor="middle" class="label" style="font-size:12px;letter-spacing:1px">CONVERSE</text>

  <!-- Output and safety -->
  <path d="M1135 506 V555" stroke="#fb923c" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="1170" y="514" width="174" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="1186" y="536" class="label">VALIDATED DRAFT</text>

  <g filter="url(#shadow)">
    <rect x="480" y="575" width="790" height="240" rx="18" fill="#f8fafc"/>
    <rect x="480" y="575" width="790" height="9" rx="4" fill="#a78bfa"/>
    <text x="512" y="620" class="eyebrow" fill="#6d28d9">05 / OUTPUT</text>
    <text x="512" y="658" class="card-title">Reviewable handoff in the browser</text>
    <rect x="512" y="694" width="220" height="82" rx="12" fill="#eef2ff"/>
    <text x="532" y="724" class="output-title">DISCOVERY BRIEF</text>
    <text x="532" y="750" class="output-body">Goals, constraints,</text>
    <text x="532" y="770" class="output-body">and open questions</text>
    <rect x="765" y="694" width="220" height="82" rx="12" fill="#fff7ed"/>
    <text x="785" y="724" class="output-title">PROPOSAL DRAFT</text>
    <text x="785" y="750" class="output-body">Scope, deliverables,</text>
    <text x="785" y="770" class="output-body">and timeline</text>
    <rect x="1018" y="694" width="220" height="82" rx="12" fill="#ecfeff"/>
    <text x="1038" y="724" class="output-title">FOLLOW-UP TASKS</text>
    <text x="1038" y="750" class="output-body">Owners, due dates,</text>
    <text x="1038" y="770" class="output-body">and rationale</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1310" y="575" width="420" height="240" rx="18" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1"/>
    <text x="1342" y="620" class="eyebrow">TRUST BOUNDARY</text>
    <text x="1342" y="658" class="card-title-light">Human stays in control</text>
    <text x="1342" y="698" class="small-light">- No persistence or CRM writes</text>
    <text x="1342" y="727" class="small-light">- No email or task execution</text>
    <text x="1342" y="756" class="small-light">- Text-only rendering</text>
    <text x="1342" y="785" class="small-light">- Unknowns remain open questions</text>
  </g>

  <!-- Offline and evaluation paths -->
  <text x="70" y="866" class="label">DETERMINISTIC DELIVERY PATHS</text>

  <g filter="url(#shadow)">
    <rect x="70" y="890" width="790" height="145" rx="18" fill="#172554" stroke="#60a5fa" stroke-width="1"/>
    <text x="100" y="930" class="eyebrow">OFFLINE DEMO / NO AWS CREDENTIALS</text>
    <text x="100" y="970" class="card-title-light">Fixture agent</text>
    <text x="100" y="1000" class="small-light">Deterministic result -> same Fastify API -> same React UI</text>
    <path d="M310 965 H395" stroke="#93c5fd" stroke-width="3" stroke-dasharray="8 8" fill="none" marker-end="url(#arrow-muted)"/>
    <path d="M650 965 H735" stroke="#93c5fd" stroke-width="3" stroke-dasharray="8 8" fill="none" marker-end="url(#arrow-muted)"/>
    <text x="410" y="952" class="label">INJECTED</text>
    <text x="748" y="952" class="label">RENDER</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="900" y="890" width="830" height="145" rx="18" fill="#f8fafc"/>
    <text x="930" y="930" class="eyebrow" fill="#2563eb">EVALUATION &amp; DELIVERY</text>
    <text x="930" y="970" class="card-title">Evidence before release</text>
    <text x="930" y="1000" class="small">83 tests | 6 Playwright scenarios | 89.32% statements | capped live eval: 100/100</text>
    <text x="930" y="1024" class="small">Vitest fixtures test positive and negative controls; live eval is explicit and capped at 3 attempts.</text>
  </g>

  <text x="70" y="1080" class="footer">Solid arrows = runtime path  |  Dashed arrows = offline fixture path  |  All data shown is synthetic  |  Human review required</text>
</svg>
